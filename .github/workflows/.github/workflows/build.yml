name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and patch
        run: |
          unzip -q CutSilence.zip
          cd CutSilence
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n' > gradle.properties
          sed -i 's/compileSdk = 34/compileSdk = 35/' app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        working-directory: CutSilence
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee ../build.log
      - name: Show error
        if: failure()
        run: grep -n -B2 -A12 "What went wrong" build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CutSilence-APK
          path: |
            CutSilence/app/build/outputs/apk/debug/app-debug.apk
            build.log
