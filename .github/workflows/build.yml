name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q CutSilence.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          build-root-directory: CutSilence
      - run: gradle assembleDebug --stacktrace
        working-directory: CutSilence
      - uses: actions/upload-artifact@v4
        with:
          name: CutSilence-APK
          path: CutSilence/app/build/outputs/apk/debug/app-debug.apk
